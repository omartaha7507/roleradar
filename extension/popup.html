<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RoleRadar</title>
  <style>
    :root { --ink: #1f1e1c; --muted: #6b6a65; --line: #e2e0d8; --accent: #0f6e56; --accent-soft: #e1f5ee; --bad: #a32d2d; --bad-soft: #fcebeb; }
    * { box-sizing: border-box; }
    body { margin: 0; width: 320px; font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: #fff; }
    header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
    header h1 { font-size: 14px; margin: 0; font-weight: 600; flex: 1; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #b4b2a9; }
    .dot.on { background: var(--accent); }
    main { padding: 12px 14px 14px; display: grid; gap: 10px; }
    label { font-size: 12px; color: var(--muted); display: grid; gap: 4px; }
    select, input { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; width: 100%; }
    button { font: inherit; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line); background: #fff; cursor: pointer; text-align: left; }
    button:hover:not(:disabled) { border-color: var(--accent); }
    button:disabled { color: #b4b2a9; cursor: default; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; text-align: center; }
    .group { display: grid; gap: 6px; }
    .group h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 4px 0 0; font-weight: 600; }
    #message { display: none; padding: 8px 10px; border-radius: 6px; background: var(--accent-soft); color: #085041; white-space: pre-wrap; }
    #message.error { background: var(--bad-soft); color: #791f1f; }
    #message.show { display: block; }
    details { font-size: 12px; color: var(--muted); }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <span class="dot" id="dot"></span>
    <h1>RoleRadar</h1>
    <a href="#" id="dashboard">Dashboard</a>
  </header>
  <main>
    <label>Profile
      <select id="profile"></select>
    </label>
    <button class="primary" id="scrape">Scrape my saved searches now</button>
    <div class="group">
      <h2>This page</h2>
      <button id="addJob">Add this job to RoleRadar</button>
      <button id="applied">I applied to this job</button>
      <button id="addSearch">Save this LinkedIn search</button>
    </div>
    <div id="message"></div>
    <details>
      <summary>Settings</summary>
      <label style="margin-top:6px">RoleRadar address
        <input id="server" placeholder="http://127.0.0.1:8787">
      </label>
    </details>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
